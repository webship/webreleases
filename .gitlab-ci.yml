include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

cspell:
  stage: validate
  image: node:18
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

eslint:
  stage: validate
  image: node:18
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: true

stylelint:
  stage: validate
  image: node:18
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# ─── Shared Drupal + Node.js setup for browser tests ──────────────────────────
#
# How it works:
#   1. The drupalci `composer` job builds a full Drupal site (webreleases plus
#      its dependencies) and passes its artifact to this job via
#      `needs: [composer]`.
#   2. This job runs inside the drupalci PHP-Apache image (inherited from
#      `.testing-job-base`) which already has PHP, Apache, Drush, and MySQL.
#   3. before_script installs Drupal + the module, then Node.js + yarn deps +
#      Playwright Chromium. Test jobs only override `script:`.
#   4. `DRUPAL_ADMIN_PASSWORD=admin` matches the password set by `drush si`.
# ──────────────────────────────────────────────────────────────────────────────
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services — we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "admin"
    DRUPAL_ADMIN_PASSWORD: "admin"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    # Drush command used by the releases-seeding step in the BDD suite.
    WEBRELEASES_DRUSH: "$CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT"
    FORCE_COLOR: "1"
  before_script:
    # ── Web server ──────────────────────────────────────────────────────────
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    # ── Database ────────────────────────────────────────────────────────────
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # ── Drupal site install ─────────────────────────────────────────────────
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB
        --account-name=admin
        --account-pass=admin
        --site-name="Web Releases Test"
        -y
    # ── Webpage module compatibility ────────────────────────────────────────
    # The webpage module ships node.type.webpage with a blank `help:` value.
    # Drupal 11's recipe config installer rejects a blank `help`, so the
    # webreleases recipe (which imports the webpage config) cannot install the
    # content type. Give `help` a value before enabling the module. This is a
    # no-op once the webpage module ships a non-blank `help`.
    - |
      WEBPAGE_NT="$CI_PROJECT_DIR/$_WEB_ROOT/modules/contrib/webpage/config/install/node.type.webpage.yml"
      if [ -f "$WEBPAGE_NT" ] && grep -q "^help: ''" "$WEBPAGE_NT"; then
        sed -i "s/^help: ''/help: 'Use Webpage to add a publicly accessible web page.'/" "$WEBPAGE_NT"
        echo "Patched webpage node.type help for recipe install."
      fi
    # ── Module install ──────────────────────────────────────────────────────
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en webreleases -y
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    # ── Node.js 20 ──────────────────────────────────────────────────────────
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    # ── Yarn deps + Playwright Chromium ─────────────────────────────────────
    # Force node_modules layout so node_modules/.bin/* is populated.
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js — webship-js's postinstall can clobber it under yarn 4
    # because INIT_CWD may differ from our project root inside the container.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    # Restore cucumber.js if postinstall overwrote it with the init-webship template.
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# ─── webship-js BDD functional tests ──────────────────────────────────────────
webship-js-test:
  extends: .drupal-node-base
  script:
    - ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  allow_failure: false
