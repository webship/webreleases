services:
  webreleases.product_path_processor:
    class: Drupal\webreleases\PathProcessor\WebReleasesProductPathProcessor
    arguments: ['@path_alias.manager', '@database']
    tags:
      - { name: path_processor_inbound, priority: 100 }
      # After the core alias processor (300).
      - { name: path_processor_outbound, priority: 200 }
