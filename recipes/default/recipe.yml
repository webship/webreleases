name: 'Web Releases - Default'
description: 'A recipe to manage default installed modules, configs and permissions.'
type: install
recipes:
  # The Webpage content, which creates the body field storage the product and
  # release body fields reference, and the editorial workflow they move through.
  # Installing the Webpage module from the list below is not enough: a recipe
  # installs modules with config entity installation disabled, so the config of
  # its own recipe is skipped.
  - modules/contrib/webpage/recipes/default
  # The Web Assets media stack, which creates the Image media type the product
  # and release image fields reference. Installing the Web Assets module from
  # the list below is not enough: a recipe installs modules with config entity
  # installation disabled, so the media types of its own recipe are skipped.
  - modules/contrib/webassets/recipes/default
install:
  - path
  - pathauto
  - text
  - link
  - image
  - node
  - user
  - views
  - menu_ui
  - menu_link_content
  - content_moderation
  - media
  - media_library
  - webassets
  - manage_display
  - smart_trim
  - webpage
  - display_builder
  - display_builder_entity_view
  - display_builder_ui
  # Last: the product path processor serves the releases page of a product at
  # its alias, /products/<product>/releases.
  - webreleases
config:
  strict: false
  import:
    webpage: '*'
    display_builder:
      - display_builder.profile.default
