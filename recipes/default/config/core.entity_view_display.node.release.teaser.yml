langcode: en
status: true
dependencies:
  config:
    - core.base_field_override.node.release.title
    - core.entity_view_mode.node.teaser
    - field.field.node.release.body
    - field.field.node.release.field_product
    - field.field.node.release.field_release_image
    - node.type.release
  module:
    - display_builder
    - manage_display
    - smart_trim
    - text
third_party_settings:
  display_builder:
    profile: default
    sources:
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:field_product'
          'field:node:release:field_product':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:field_product'
                  source:
                    type: entity_reference_label
                    label: hidden
                    settings:
                      link: true
                    third_party_settings: {  }
                    weight: -1
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:title'
          'field:node:release:title':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:title'
                  source:
                    type: title
                    label: hidden
                    settings:
                      link_to_entity: true
                      tag: h3
                    third_party_settings: {  }
                    weight: 0
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:created'
          'field:node:release:created':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:created'
                  source:
                    type: timestamp
                    label: hidden
                    settings:
                      date_format: custom
                      custom_date_format: 'F j, Y'
                      timezone: ''
                      tooltip:
                        date_format: long
                        custom_date_format: ''
                      time_diff:
                        enabled: false
                        future_format: '@interval hence'
                        past_format: '@interval ago'
                        granularity: 2
                        refresh: 60
                    third_party_settings: {  }
                    weight: 0
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:body'
          'field:node:release:body':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:body'
                  source:
                    type: smart_trim
                    label: hidden
                    settings:
                      trim_length: 300
                      trim_type: chars
                      trim_suffix: ''
                      wrap_output: false
                      wrap_class: trimmed
                      more:
                        display_link: false
                        target_blank: false
                        link_trim_only: false
                        class: more-link
                        text: More
                        aria_label: 'Read more about [node:title]'
                      summary_handler: full
                      trim_options:
                        text: true
                        trim_zero: false
                        replace_tokens: false
                    third_party_settings: {  }
                    weight: 1
id: node.release.teaser
targetEntityType: node
bundle: release
mode: teaser
content:
  body:
    type: text_summary_or_trimmed
    label: hidden
    settings:
      trim_length: 600
    third_party_settings: {  }
    weight: 101
    region: content
  created:
    type: timestamp
    label: hidden
    settings:
      date_format: custom
      custom_date_format: 'F j, Y'
      timezone: ''
      tooltip:
        date_format: long
        custom_date_format: ''
      time_diff:
        enabled: false
        future_format: '@interval hence'
        past_format: '@interval ago'
        granularity: 2
        refresh: 60
    third_party_settings: {  }
    weight: -48
    region: content
  field_product:
    type: entity_reference_label
    label: hidden
    settings:
      link: true
    third_party_settings: {  }
    weight: -50
    region: content
  links:
    settings: {  }
    third_party_settings: {  }
    weight: 100
    region: content
  title:
    type: title
    label: hidden
    settings:
      link_to_entity: true
      tag: h2
    third_party_settings: {  }
    weight: -49
    region: content
hidden:
  field_release_image: true
  uid: true
