langcode: en
status: true
dependencies:
  config:
    - core.base_field_override.node.release.title
    - core.entity_view_mode.node.product_release
    - field.field.node.release.body
    - field.field.node.release.field_product
    - field.field.node.release.field_release_image
    - node.type.release
  module:
    - display_builder
    - manage_display
    - smart_trim
    - text
third_party_settings:
  display_builder:
    profile: default
    sources:
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:title'
          'field:node:release:title':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:title'
                  source:
                    type: title
                    label: hidden
                    settings:
                      link_to_entity: true
                      tag: h3
                    third_party_settings: {  }
                    weight: 0
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:created'
          'field:node:release:created':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:created'
                  source:
                    type: timestamp
                    label: hidden
                    settings:
                      date_format: custom
                      custom_date_format: 'F j, Y'
                      timezone: ''
                      tooltip:
                        date_format: long
                        custom_date_format: ''
                      time_diff:
                        enabled: false
                        future_format: '@interval hence'
                        past_format: '@interval ago'
                        granularity: 2
                        refresh: 60
                    third_party_settings: {  }
                    weight: 1
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:release:body'
          'field:node:release:body':
            value:
              sources:
                -
                  source_id: 'field_formatter:node:release:body'
                  source:
                    type: smart_trim
                    label: hidden
                    settings:
                      trim_length: 300
                      trim_type: chars
                      trim_suffix: ''
                      wrap_output: false
                      wrap_class: trimmed
                      more:
                        display_link: false
                        target_blank: false
                        link_trim_only: false
                        class: more-link
                        text: More
                        aria_label: 'Read more about [node:title]'
                      summary_handler: full
                      trim_options:
                        text: true
                        trim_zero: false
                        replace_tokens: false
                    third_party_settings: {  }
                    weight: 2
id: node.release.product_release
targetEntityType: node
bundle: release
mode: product_release
content:
  body:
    type: smart_trim
    label: hidden
    settings:
      trim_length: 300
      trim_type: chars
      trim_suffix: ''
      wrap_output: false
      wrap_class: trimmed
      more:
        display_link: false
        target_blank: false
        link_trim_only: false
        class: more-link
        text: More
        aria_label: 'Read more about [node:title]'
      summary_handler: full
      trim_options:
        text: true
        trim_zero: false
        replace_tokens: false
    third_party_settings: {  }
    weight: 2
    region: content
  created:
    type: timestamp
    label: hidden
    settings:
      date_format: custom
      custom_date_format: 'F j, Y'
      timezone: ''
      tooltip:
        date_format: long
        custom_date_format: ''
      time_diff:
        enabled: false
        future_format: '@interval hence'
        past_format: '@interval ago'
        granularity: 2
        refresh: 60
    third_party_settings: {  }
    weight: 1
    region: content
  title:
    type: title
    label: hidden
    settings:
      link_to_entity: true
      tag: h3
    third_party_settings: {  }
    weight: 0
    region: content
hidden:
  field_product: true
  field_release_image: true
  field_release_link: true
  links: true
  uid: true
