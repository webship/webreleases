                    type: title
                    label: hidden
                    settings:
                      link_to_entity: true
                      tag: h3
                    third_party_settings: {  }
                    weight: 1
      -
        source_id: entity_field
        source:
          derivable_context: 'field:node:product:body'
          'field:node:product:body':
